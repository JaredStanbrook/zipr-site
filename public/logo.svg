<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64" role="img" aria-label="Zipr">
  <!--
    The Zipr mark, traced from the supplied raster rather than redrawn by eye.

    The original is 256x128 with exactly two colours and every edge on a 16px
    boundary, so it is a 16x8 grid of blocks with 40 of them filled — which
    means this is the artwork, not an approximation of it. The blocks below are
    those cells, merged into runs, trimmed of the empty rows top and bottom.

    A Z: two bars offset by one cell, and between them the two interleaved
    combs that close into a solid block at the right. Zipper teeth.

    #ff5722 is the raster's exact fill. It is the logo's colour and it is
    deliberately brighter than the `primary` token, which has to carry white
    text and so sits a few steps deeper; see worker/index.css.
  -->
  <g fill="#ff5722">
    <rect x="16" y="0" width="176" height="16" />
    <rect x="32" y="16" width="16" height="16" />
    <rect x="64" y="16" width="16" height="16" />
    <rect x="96" y="16" width="16" height="16" />
    <rect x="128" y="16" width="16" height="16" />
    <rect x="160" y="16" width="16" height="16" />
    <rect x="192" y="16" width="64" height="16" />
    <rect x="16" y="32" width="16" height="16" />
    <rect x="48" y="32" width="16" height="16" />
    <rect x="80" y="32" width="16" height="16" />
    <rect x="112" y="32" width="16" height="16" />
    <rect x="144" y="32" width="16" height="16" />
    <rect x="176" y="32" width="32" height="16" />
    <rect x="224" y="32" width="32" height="16" />
    <rect x="0" y="48" width="176" height="16" />
  </g>
</svg>
