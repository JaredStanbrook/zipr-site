<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Zipr">
  <!--
    The badge form of the Zipr mark, for the browser tab and for the lockup in
    the nav bar and footer, where it sits at 24px beside the word "Zipr".

    The full mark (public/logo.svg) is sixteen blocks wide. Squeezed into a
    square its teeth land on half a pixel and it turns to mush, so this is a
    crop instead of a redrawing: columns 3 to 6 of the mark's own grid, which
    happen to be exactly four blocks by four. Two bars and the teeth between
    them — a section of zipper, and every block of it is in the artwork.

    Cream on the logo's own #ff5722 rather than on the `primary` token: a badge
    is artwork, not a control, and it should be the colour the logo is.
  -->
  <rect width="32" height="32" rx="7" fill="#ff5722" />
  <g fill="#fbf8f3">
    <rect x="6" y="6" width="20" height="5" />
    <rect x="6" y="11" width="5" height="5" />
    <rect x="16" y="11" width="5" height="5" />
    <rect x="11" y="16" width="5" height="5" />
    <rect x="21" y="16" width="5" height="5" />
    <rect x="6" y="21" width="20" height="5" />
  </g>
</svg>
