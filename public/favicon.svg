<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Zipr">
  <!--
    The desktop client's hammer-in-a-ring mark, redrawn as vector and recoloured
    to the clay primary. The client ships it as a magenta raster inherited from
    the launcher Zipr descends from; magenta appears nowhere in the palette, so
    the shape came across and the colour did not.

    Placeholder to the extent that it is a redrawing rather than the original
    vector — if that artwork turns up, swap this file for it.
  -->
  <rect width="32" height="32" rx="7" fill="#524bc4" />
  <circle cx="16" cy="16" r="11.4" fill="none" stroke="#fbf8f3" stroke-width="2" />
  <g transform="rotate(-32 16 16)" fill="#fbf8f3">
    <!-- Head, with a V notch at the left end standing in for the claw. -->
    <path d="M21.6 8.7a1.4 1.4 0 0 1 0 4.6h-8.2l-4-1.4 2.5-.9-2.5-.9 4-1.4z" />
    <!-- Handle. -->
    <rect x="14.6" y="12.8" width="2.9" height="11" rx="1.45" />
  </g>
</svg>
