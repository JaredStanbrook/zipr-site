name: CI

# Run by hand, on your own machine. Nothing here starts on a push or a pull
# request, and nothing runs on GitHub's hosted runners: the job needs a
# self-hosted runner (the build VM), so a run with no VM online waits rather
# than costing anything.
#
# The checks are scripts/ci.sh, and this only runs it — so `scripts/ci.sh` on
# the VM by hand is the same CI.
#
# Deployment is not here either: Cloudflare's Git integration (Workers & Pages
# → the Worker → Settings → Builds) builds and deploys on push, on
# Cloudflare's machines.
#
# The runner is the repository variable SITE_RUNNER, a JSON value, default
# ["self-hosted","linux"]. Node (.node-version) must be on the machine.
on:
  workflow_dispatch:
    inputs:
      keep_going:
        description: "Run every step and list what failed, rather than stopping at the first"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: scripts/ci.sh
    runs-on: ${{ fromJSON(vars.SITE_RUNNER || '["self-hosted","linux"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci.sh ${{ inputs.keep_going && '--keep-going' || '' }}
