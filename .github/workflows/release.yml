name: Release

# Tags a GitHub release for the site, with notes generated from the commits
# since the last one. Deployment is separate — Cloudflare's Git integration
# deploys on push, not on tag.
#
# Run by hand only, on a self-hosted runner: push the tag, then Actions →
# Release → Run workflow, choosing the tag under "Use workflow from". It runs
# CI first and refuses anything that is not a `v*` tag.
on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ${{ fromJSON(vars.SITE_RUNNER || '["self-hosted","linux"]') }}
    permissions:
      contents: write
    steps:
      - name: A tag, not a branch
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this from a v* tag (Use workflow from → Tags), not from ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v4

      - name: CI
        run: scripts/ci.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
